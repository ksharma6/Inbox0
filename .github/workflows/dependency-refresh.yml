name: Dependency refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "America/Los_Angeles"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Refresh lockfile
        run: uv lock --upgrade

      - name: Validate dependencies
        run: uv sync --group dev --locked

      - name: Security scan
        run: uv run --locked pip-audit

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: maintenance/refresh-uv-lock
          delete-branch: true
          title: "[MNT] Refresh uv lockfile"
          commit-message: "[MNT] Refresh uv lockfile"
          body: |
            ## Summary
            - Refreshes `uv.lock` with `uv lock --upgrade`.
            - Validates dependencies with `uv sync --group dev --locked`.
            ## Test plan
            - `uv sync --group dev --locked`
            - `uv run --locked pip-audit`
